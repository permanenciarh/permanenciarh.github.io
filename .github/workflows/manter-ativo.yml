# Mantém o projeto Supabase ativo: o plano gratuito pausa projetos após 7 dias sem uso.
# Usa o endereço e a chave pública que já estão em js/config.js (nada secreto).
name: Manter Supabase ativo
on:
  schedule:
    - cron: "17 11 */3 * *"   # a cada 3 dias, 08:17 em Brasília
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Chamar ping()
        run: |
          URL=$(grep -oP 'supabaseUrl:\s*"\K[^"]+' js/config.js); KEY=$(grep -oP 'supabaseAnonKey:\s*"\K[^"]+' js/config.js)
          if [ -z "$URL" ]; then echo "Site ainda não ligado ao Supabase"; exit 0; fi
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$URL/rest/v1/rpc/ping" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}')
          echo "HTTP $code"; test "$code" = "200"
